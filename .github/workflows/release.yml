name: Release

# A tag like v0.1.0 builds ready-to-play zips for Windows, Linux and macOS and publishes them as a release.
# Run it by hand (Actions > Release > Run workflow) to get the zips as build artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    name: Export Windows, Linux and macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot and its export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-download
          key: godot-${{ env.GODOT_VERSION }}-mono

      - name: Install Godot .NET and its export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-download
          cd ~/godot-download
          [ -f godot.zip ] || curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          rm -rf editor tpl && unzip -q godot.zip -d editor && unzip -q templates.tpz -d tpl
          version="$(cat tpl/templates/version.txt)"
          mkdir -p "$HOME/.local/share/godot/export_templates/$version"
          cp -r tpl/templates/. "$HOME/.local/share/godot/export_templates/$version/"
          godot="$(find "$HOME/godot-download/editor" -type f -name 'Godot_v*_mono_linux*.x86_64' | head -n 1)"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"

      - name: Import the project
        run: $GODOT --headless --path game --import

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/macos
          $GODOT --headless --path game --export-release "Windows Desktop" ../build/windows/OpenCorneroids.exe
          $GODOT --headless --path game --export-release "Linux" ../build/linux/OpenCorneroids.x86_64
          $GODOT --headless --path game --export-release "macOS" ../build/macos/OpenCorneroids.zip
          ls -R build | head -n 60

      - name: Package with the bundled game data
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          for os in windows linux; do
            cp -r byoa LICENSE CREDITS.md "build/$os/"
          done
          (cd build/windows && zip -qr "../../dist/OpenCorneroids-$version-windows-x86_64.zip" .)
          tar -czf "dist/OpenCorneroids-$version-linux-x86_64.tar.gz" -C build/linux .
          mkdir -p build/macos/unpacked
          unzip -q build/macos/OpenCorneroids.zip -d build/macos/unpacked
          app="$(find build/macos/unpacked -maxdepth 1 -name '*.app' | head -n 1)"
          cp -r byoa "$app/Contents/Resources/"
          cp LICENSE CREDITS.md build/macos/unpacked/
          (cd build/macos/unpacked && zip -qry "../../../dist/OpenCorneroids-$version-macos-universal.zip" .)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: open-corneroids-${{ github.ref_name }}
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Open Corneroids $GITHUB_REF_NAME" --generate-notes
